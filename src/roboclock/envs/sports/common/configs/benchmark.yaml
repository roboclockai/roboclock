sim:
  physics_dt: 0.004
  control_decimation: 5
  camera_resolution: [960, 720]
  settle_steps: 188  # 0.75 s
visuals:
  anti_aliasing: 4  # DLAA, the renderer default these recordings were made with
  renderer: RaytracedLighting
  render_updates: 24
  hdr: shared://hdr/studio_small_09_2k.hdr
  materials:
    worktop: {texture_set: epoxy, uv_scale: [1.0, 1.0], normal_strength: 0.18, roughness_map_weight: 0.5}
    steel: {texture_set: brushed_steel, uv_scale: [2.0, 2.0], normal_strength: 0.2, roughness_map_weight: 0.65}
    wall: {texture_set: painted_plaster_wall, uv_scale: [0.5, 0.5], normal_strength: 0.15, tint: [0.84, 0.91, 0.98]}
    floor: {texture_set: grey_tiles, uv_scale: [0.75, 0.75], normal_strength: 0.15, roughness_map_weight: 0.7}
scene:
  table_height: 0.75
  spatial_jitter: 0.012
  mass_range: [0.035, 0.055]
  friction_range: [0.65, 0.9]
  camera_position: [1.35, -1.25, 1.80]
  camera_look_at: [0.43, 0.0, 0.83]
physics:
  placement_dwell: 0.2
  hold_dwell: 0.5
  contact_force: 0.04
  max_linear_speed: 0.03
  max_angular_speed: 0.3
  max_tilt: 0.14
  button_travel: 0.008
  button_threshold: 0.003
  button_dwell: 0.025
control:
  # 1.5 at the original 30 Hz: the oracle steps from measured joints, so the same
  # arm speed needs a larger limit at 50 Hz (see sports/joints.py).
  joint_target_speed: 1.925
  transit_height: 0.99
  cartesian_speed: 0.35
  dumbbell_finger_force: 60.0
  dumbbell_gripper_stiffness: 4000.0
  dumbbell_speed: 0.07
