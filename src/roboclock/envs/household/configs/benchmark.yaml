# Dual-X5 household runtime (roboclock.envs.household.x5.env:HouseholdX5Env, `roboclock eval --env
# household`). Rates match the recorded episodes in data/household/x5_demos (physics 250 Hz,
# joint-position control 50 Hz, 3 s passive settling before t = 0, process cues every 10 ticks).
# The sections above are the legacy schema of the earlier task-specific recorders.
x5:
  physics_dt: 0.004
  control_decimation: 5
  settle_seconds: 3.0
  cue_interval_ticks: 10
  # Policy cameras and renderer: the RoboDojo rig spec (roboclock.envs.robodojo_rig). Head camera
  # /World/AgentCamera (rgb) and one wrist camera per arm on link6 (left_wrist_rgb,
  # right_wrist_rgb), all 640x480, rendered on read with RaytracedLighting + DLAA.
  camera: /World/AgentCamera
  camera_resolution:
  - 640
  - 480
  # true: no cameras, no render calls; observations carry zero images of the same shapes
  # (configs/no_render.yaml, for headless oracle iteration).
  no_render: false
  # Per-environment scene files (initial scene built in code + physics overlay). null: a
  # temporary folder under <repo>/results/household (git-ignored), removed on close().
  scene_dir: null
  # true: the recorder's video mode (Fabric off, physics results written to USD). Outcomes
  # were identical either way in a C3 check; off is faster.
  physics_to_usd: false
